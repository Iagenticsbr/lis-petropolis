<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>LIS · Arquitetura, dados e motor de análise</title>
<style>
{{FONTFACE}}
:root{
  --fg:#12202B; --muted:#4F5F6B; --line:#AEBBC4; --surface:#FFFFFF; --sunken:#E9EEF1; --env:#EEF3F5;
  --accent:#0B6E78; --tint:#E3F0F1; --ext:#A94F08; --ext-bg:#FBEDDC;
  --f-display:"Bricolage Grotesque","Inter",sans-serif;
  --f-body:"Source Sans 3","Inter",sans-serif;
  --f-mono:"JetBrains Mono","DejaVu Sans Mono",monospace;
}
@page{ size:A4; margin:18mm 17mm 21mm 17mm; }
@page wide{ size:A4 landscape; margin:13mm 14mm 17mm 14mm; }
*{box-sizing:border-box}
html{font:400 9.6pt/1.5 var(--f-body); color:var(--fg); -webkit-print-color-adjust:exact; print-color-adjust:exact}
body{margin:0}
.wide{page:wide; break-before:page}
.sec{break-before:page}
h1,h2,h3{break-after:avoid}
h1{font:700 22pt/1.1 var(--f-display); letter-spacing:-.01em; margin:0 0 6pt; text-wrap:balance}
h2{font:600 13.5pt/1.2 var(--f-display); margin:16pt 0 4pt; text-wrap:balance}
.wide h2{margin-top:0}
h3{font:600 10.5pt/1.3 var(--f-display); margin:12pt 0 3pt}
p{margin:4pt 0; max-width:none}
.lead{font-size:11pt; line-height:1.45; margin:2pt 0 8pt}
.note{font-size:8.4pt; color:var(--muted)}
code,.mono{font:400 .88em var(--f-mono)}
a{color:var(--accent); text-decoration:none}
strong{font-weight:700}
ul{margin:3pt 0; padding-left:14pt} li{margin:0 0 3pt; break-inside:avoid}
.eyebrow{font:500 7.5pt/1.3 var(--f-mono); letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}

/* capa */
.cover{break-after:page; display:flex; flex-direction:column; min-height:255mm}
.cover h1{font-size:34pt; line-height:1.05; margin:14pt 0 12pt; max-width:15ch}
.cover .sub{font-size:13pt; line-height:1.4; max-width:34em; margin:0 0 22pt}
.cover table{width:100%; border-collapse:collapse; margin:0 0 20pt; font-size:9.4pt}
.cover td{padding:5pt 0; border-top:1px solid var(--line); vertical-align:top}
.cover td:first-child{width:24%; font:500 7.5pt/1.8 var(--f-mono); letter-spacing:.07em; text-transform:uppercase; color:var(--muted)}
.cover .art{margin-top:auto}
.cover .fine{margin-top:12pt; font-size:8pt; color:var(--muted)}

/* sumário */
.toc a{display:flex; align-items:baseline; gap:6pt; color:var(--fg); padding:1.6pt 0}
.toc a i{flex:1; border-bottom:1px dotted var(--line); transform:translateY(-2pt)}
.toc a b{font:500 8.4pt var(--f-mono); color:var(--muted)}
.toc .l1{font-weight:700; margin-top:7pt; font-size:10.2pt}
.toc .l2{padding-left:14pt; font-size:9.2pt}
.toc .l1 b{color:var(--fg)}

/* tabelas */
table{border-collapse:collapse; width:100%; font-size:8.5pt; line-height:1.4; margin:6pt 0}
th{font:500 6.8pt/1.3 var(--f-mono); letter-spacing:.06em; text-transform:uppercase; text-align:left; color:var(--muted); padding:4pt 6pt; border-bottom:1.3px solid var(--line); vertical-align:bottom}
td{padding:4pt 6pt; border-bottom:.8px solid var(--line); vertical-align:top}
tr{break-inside:avoid}
td:first-child{font-weight:600}
.dict{margin-top:8pt}
.dict thead tr:first-child th{background:var(--tint); color:var(--fg); font:600 8.6pt/1.3 var(--f-body); letter-spacing:0; text-transform:none; padding:5pt 6pt; border-bottom:none}
.dict td:first-child{font-family:var(--f-mono); font-weight:500; font-size:.9em; white-space:nowrap}
.dict td:nth-child(2){font-family:var(--f-mono); font-size:.88em; color:var(--muted); white-space:nowrap}
.compact{font-size:8.1pt; line-height:1.3}
.compact td{padding:2.5pt 6pt}
.dict{break-inside:avoid; table-layout:fixed}
.w-narrow td:first-child{white-space:nowrap}

pre{font:400 7.3pt/1.42 var(--f-mono); background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:6pt 9pt; margin:5pt 0; white-space:pre-wrap; word-break:break-word; break-inside:avoid}
pre.long{break-inside:auto}
.cols2{display:grid; grid-template-columns:1fr 1fr; gap:14pt}
.cols2>*{min-width:0}
.defs{display:grid; grid-template-columns:1fr 1fr; gap:6pt 16pt; margin:6pt 0}
.defs div{break-inside:avoid; padding:5pt 0; border-top:1px solid var(--line)}
.defs b{display:block; font:600 9.6pt var(--f-display)}
.defs span{font-size:8.7pt; color:var(--muted)}
.tag{font:500 6.5pt/1 var(--f-mono); letter-spacing:.05em; text-transform:uppercase; color:var(--ext); border:1px solid var(--ext); border-radius:2px; padding:1.5pt 3pt; margin-left:4pt; white-space:nowrap}

/* figuras */
figure{margin:6pt 0 0; break-inside:avoid}
figure svg{display:block; width:100%; height:auto}
figcaption{font-size:8.4pt; color:var(--muted); margin-top:6pt}
figcaption b{color:var(--fg)}
.legend{display:flex; flex-wrap:wrap; gap:3pt 16pt; font-size:8pt; color:var(--muted); margin-top:6pt}
.sw{display:inline-block; width:15pt; height:9pt; border-radius:2px; vertical-align:-1pt; margin-right:5pt; border:1.2px solid var(--line); background:var(--surface)}
.sw.is-ext{border-color:var(--ext); border-style:dashed; background:var(--ext-bg)}
.sw.is-key{border-color:var(--accent); border-width:1.6px}
.sw.is-src{background:var(--sunken); border-color:transparent}
.sw.is-ana{background:var(--tint); border-color:var(--accent)}
.sw.is-gov{background:var(--sunken)}
svg{color:var(--fg)}
svg .box{fill:var(--surface); stroke:var(--line); stroke-width:1.5}
svg .ext{fill:var(--ext-bg); stroke:var(--ext); stroke-width:1.5; stroke-dasharray:6 4}
svg .key{fill:var(--surface); stroke:var(--accent); stroke-width:2}
svg .src{fill:var(--sunken); stroke:none}
svg .env{fill:var(--env); stroke:var(--line); stroke-width:1.5}
svg .zana{fill:var(--tint); stroke:var(--accent); stroke-width:1.5}
svg .zgov{fill:var(--sunken); stroke:var(--line); stroke-width:1.5}
svg .edge{stroke:var(--fg); stroke-width:1.5; fill:none}
svg .soft{stroke:var(--muted); stroke-dasharray:3 4}
svg text{fill:var(--fg); font-family:var(--f-body); font-size:12px; font-weight:600}
svg .t2{font-weight:400; font-size:11px; fill:var(--muted)}
svg .m{font-family:var(--f-mono); font-size:10.5px; font-weight:400}
svg .c{text-anchor:middle} svg .s{text-anchor:start} svg .e{text-anchor:end}
</style>
</head>
<body>
